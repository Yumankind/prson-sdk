name = "prson-login-signaling"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "LOGIN_SESSIONS", class_name = "LoginSession" }
]

[[migrations]]
tag = "v1"
new_classes = ["LoginSession"]

# Per-IP draft-creation rate-limit counter. Keys live for 60 seconds.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "set-via-wrangler"   # cf. `wrangler kv namespace create prson-login-rate-limit`

[vars]
# Non-secret. Used for cosmetic logging + the canonical issuer string we
# echo back to verifiers. Real auth is the wallet's Ed25519 signature on
# /session/claim — no Firebase ID token verification needed here anymore.
SIGNALING_VERSION = "prson-login-v1"

# Per-IP draft creations allowed per 60-second window. Overridable per
# env via `wrangler deploy --var DRAFT_RATE_PER_MIN=N`.
DRAFT_RATE_PER_MIN = "30"

# Secrets — set via `wrangler secret put`:
#   SIG_TOKEN_HMAC_KEYRING preferred. JSON of the form
#                          `{ "active": { "kid": "k1", "secret": "<b64>" },
#                             "retired": [
#                               { "kid": "k0", "secret": "<b64>",
#                                 "validUntil": <epoch sec> }
#                             ] }`
#                          The Worker mints under `active.kid` and accepts
#                          any kid whose entry is active OR retired (until
#                          `validUntil`). Rotation: add new active, demote
#                          the prior active to retired with
#                          `validUntil = now + 900s`, deploy.
#   SIG_TOKEN_HMAC_SECRET  legacy single-secret fallback — used only when
#                          KEYRING is unset, OR to verify 3-segment tokens
#                          issued before the keyring was rolled out
#                          (these tokens have a 15-min TTL so the back-
#                          compat window closes fast).
#   CF_TURN_KEY_ID         Cloudflare TURN key id (semi-secret).
#   CF_TURN_API_TOKEN      Cloudflare TURN API token (full secret).
#
# Deploy:
#   cd login-sdk/infra/signaling-worker
#   wrangler kv namespace create prson-login-rate-limit  # update id above
#   wrangler secret put SIG_TOKEN_HMAC_SECRET
#   wrangler secret put CF_TURN_KEY_ID
#   wrangler secret put CF_TURN_API_TOKEN
#   wrangler deploy
