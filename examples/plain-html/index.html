<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in with Prson — plain-HTML example</title>
    <style>
      /*
       * Page-level chrome ONLY. The QR card + countdown + refresh
       * affordance are styled by `@prson/login-sdk-ui`, which
       * injects its own `<style data-prson-login-ui>` block on
       * import. Don't duplicate those rules here — partner-side
       * overrides should target `[data-prson-login-ui]` selectors
       * with higher specificity instead.
       */
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
        --bg: #fafafa;
        --fg: #111;
        --muted: #6b7280;
        --card: #ffffff;
        --border: rgba(0, 0, 0, 0.08);
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.05);
        --accent: #111;
        --accent-on: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0c;
          --fg: #f5f5f7;
          --muted: #9ca3af;
          --card: #18181b;
          --border: rgba(255, 255, 255, 0.08);
          --shadow: 0 8px 24px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.4);
          --accent: #f5f5f7;
          --accent-on: #0b0b0c;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 48px 20px;
        box-sizing: border-box;
      }
      .hero {
        max-width: 560px;
        text-align: center;
        margin-bottom: 32px;
      }
      h1 {
        font-weight: 600;
        letter-spacing: -0.6px;
        font-size: 30px;
        margin: 0 0 8px;
      }
      .hero p {
        color: var(--muted);
        margin: 0;
        line-height: 1.55;
        font-size: 15px;
      }
      .signin {
        font-size: 16px;
        font-weight: 500;
        padding: 12px 22px;
        border-radius: 10px;
        border: 0;
        cursor: pointer;
        background: var(--accent);
        color: var(--accent-on);
        margin-top: 20px;
        transition: transform 0.05s ease, opacity 0.15s ease;
      }
      .signin:hover { opacity: 0.92; }
      .signin:active { transform: translateY(1px); }
      .signin:disabled { opacity: 0.5; cursor: not-allowed; }
      #prson-login-qr { display: contents; }

      .result-card {
        margin-top: 40px;
        max-width: 560px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        box-shadow: var(--shadow);
      }
      .result-card h2 {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--muted);
        margin: 0 0 10px;
      }
      pre {
        margin: 0;
        font-family: "SF Mono", Menlo, monospace;
        font-size: 12.5px;
        line-height: 1.55;
        overflow: auto;
        max-height: 320px;
        background: transparent;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <h1>Sign in with Prson</h1>
      <p>
        Static page, no backend. The SDK opens an end-to-end-encrypted
        channel to your phone; your phone returns a verifiable credential
        that lands here.
      </p>
      <button id="signin" type="button" class="signin">Sign in with Prson</button>
    </div>

    <div id="prson-login-qr"></div>

    <div class="result-card">
      <h2>Result</h2>
      <pre id="out">awaiting a successful sign-in…</pre>
    </div>

    <!--
      ─── @prson/login-sdk-ui ────────────────────────────────────────
      Optional companion bundle. Side-effect import: registers a styled
      QR card renderer on `window.__prsonLoginQrRenderer` before the
      base SDK calls signIn(). If you remove this script tag the
      base SDK still works — it'll fall back to a text-only QR url
      with a console warning.

      Built from `login-sdk/packages/browser-ui` via:
        cd login-sdk/packages/browser-ui
        npm run build:example
      ────────────────────────────────────────────────────────────────
    -->
    <script type="module" src="./prson-login-ui.js"></script>

    <script type="module">
      // ─── @prson/login-sdk (the base, headless SDK) ───────────────
      // Built from `login-sdk/packages/browser` via:
      //   cd login-sdk/packages/browser
      //   npx esbuild src/index.ts --bundle --format=esm \
      //     --target=es2020 --platform=browser \
      //     --outfile=../../examples/plain-html/prson-login.js \
      //     --sourcemap
      //
      // In production: host the bundle on your own CDN or
      // npm-install `@prson/login-sdk` + (optional)
      // `@prson/login-sdk-ui`.
      import { PrsonLogin } from "./prson-login.js";

      const out = document.querySelector("#out");
      const btn = document.querySelector("#signin");

      btn.addEventListener("click", async () => {
        btn.disabled = true;
        out.textContent = "starting…";
        try {
          const result = await PrsonLogin.signIn({
            required: { },
            ttlMinutes: 10,
            ui: { mountQrInto: "#prson-login-qr", theme: "auto" },
            environment: "dev",
          });

          out.textContent = JSON.stringify(
            {
              cnfJwkX: result.cnf.jwk.x,
              vct: result.credential.vct,
              expiresAt: new Date(result.credential.expiresAt).toISOString(),
              claims: result.claims,
            },
            null,
            2,
          );

          result.session.onRenewed(() => {
            out.textContent += `\n\nrenewed at ${new Date().toISOString()}`;
          });
          result.session.onExpiry((reason) => {
            out.textContent += `\n\nexpired: ${reason}`;
          });
        } catch (err) {
          out.textContent = `error: ${err.message ?? err}`;
        } finally {
          btn.disabled = false;
        }
      });

      // ─── Refresh contract ────────────────────────────────────────
      // When the QR's TTL expires the UI's refresh button dispatches
      // a bubbling `prson-login-refresh-requested` event. We listen
      // at document level and re-click the main Sign-in button —
      // the SDK tears the prior card down via dispose() and mounts
      // a new one with a fresh server timestamp.
      document.addEventListener("prson-login-refresh-requested", () => {
        btn.click();
      });
    </script>
  </body>
</html>
